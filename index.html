<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空き時間ビューア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">刻</span>
      <div class="brand-text">
        <h1>空き時間ビューア</h1>
        <p>Availability Grid — 8月の予定を色でまとめて見る</p>
      </div>
    </div>
    <div class="status" id="dataStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">読み込み中…</span>
    </div>
  </header>

  <p class="error" id="loadError" hidden></p>

  <section class="panel grid-panel" id="gridPanel" hidden>
    <div class="panel-head">
      <h2>空き状況グリッド</h2>
      <div class="head-controls">
        <div class="granularity" id="granularityControl">
          <button data-g="day" class="gbtn active">1日</button>
          <button data-g="ampm" class="gbtn">午前午後</button>
          <button data-g="hour" class="gbtn">1時間ごと</button>
          <button data-g="half" class="gbtn">30分ごと</button>
          <button data-g="quarter" class="gbtn">15分ごと</button>
        </div>
        <button id="addBlockToggle" class="btn-plus" title="カスタム時間帯を追加">＋</button>
        <div class="expand-controls">
          <button id="expandAllBtn" class="btn-text">すべて展開</button>
          <button id="collapseAllBtn" class="btn-text">すべて折りたたむ</button>
        </div>
      </div>
    </div>

    <div class="add-block-bar" id="addBlockBar" hidden>
      <label>開始 <select id="customStart"></select></label>
      <span class="arrow">→</span>
      <label>終了 <select id="customEnd"></select></label>
      <label class="custom-label-field">ラベル（任意） <input type="text" id="customLabel" placeholder="例：ランチMTG候補"></label>
      <button id="addBlockBtn" class="btn btn-primary">全日付に追加</button>
    </div>
    <div class="custom-chip-row" id="customChipRow"></div>

    <div class="member-panel">
      <span class="member-panel-label">表示するメンバー：</span>
      <div class="member-chip-row" id="memberChipRow"></div>
    </div>

    <div class="legend">
      <span class="legend-item"><i class="swatch swatch-red"></i>その人が全コマ埋まり</span>
      <span class="legend-item"><i class="swatch swatch-yellow"></i>一部埋まり</span>
      <span class="legend-item"><i class="swatch swatch-green"></i>全コマ空き</span>
      <span class="legend-item"><i class="swatch swatch-other"></i>その他（未定など）</span>
      <span class="legend-item"><i class="swatch swatch-nodata"></i>データなし</span>
    </div>
    <div class="grid-scroll">
      <table id="mainGrid"></table>
    </div>
  </section>

  <div class="tooltip" id="tooltip" hidden></div>

</div>

<script src="app.js"></script>
</body>
</html>
